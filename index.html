<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Interactive Avatar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Seamless Fullscreen Canvas -->
  <canvas id="avatar-canvas"></canvas>

  <!-- Interactive Cursor Follower -->
  <div id="cursor-glow" class="cursor-glow"></div>
  <div id="cursor-dot" class="cursor-dot"></div>

  <!-- Minimalist Initial Preload Indicator -->
  <div id="top-loader" class="top-loader">
    <div id="top-loader-bar" class="top-loader-bar"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
