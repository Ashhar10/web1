<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Interactive Avatar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Infinite Blur Background Canvas & Foreground Sharp Canvas -->
  <canvas id="ambient-canvas"></canvas>
  <canvas id="avatar-canvas"></canvas>

  <!-- Interactive Cursor Follower -->
  <div id="cursor-glow" class="cursor-glow"></div>
  <div id="cursor-dot" class="cursor-dot"></div>

  <!-- High-Impact Editorial Split Loader (Outlined Numbers Only, Page Split on Complete) -->
  <div id="split-loader" class="split-loader">
    <div class="split-pane split-top" id="split-top">
      <div class="split-inner">
        <span id="stroke-num-top" class="stroke-number">00</span>
      </div>
    </div>
    <div class="split-pane split-bottom" id="split-bottom">
      <div class="split-inner">
        <span id="stroke-num-bottom" class="stroke-number">00</span>
      </div>
    </div>
    <div class="split-seam"></div>
  </div>

  <script src="public/assets/confetti.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
